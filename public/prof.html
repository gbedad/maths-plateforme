<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espace enseignant · Maths par l'exemple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500&family=STIX+Two+Text:wght@500;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">ℕ</span>Maths par l'exemple <small>Espace enseignant</small></div>
  <div class="who" id="who" hidden><span><b>Administrateur</b></span><button class="linkbtn" id="logout">Se déconnecter</button></div>
</header>

<div class="login-wrap" id="login" hidden>
  <form class="card login" id="loginForm">
    <h1>Espace enseignant</h1>
    <p>Entre le mot de passe administrateur défini lors de l'installation.</p>
    <div class="field"><label for="lgPass">Mot de passe</label><div class="pw-wrap"><input id="lgPass" type="password" required autocomplete="current-password"><button type="button" class="pw-eye" aria-label="Afficher le mot de passe" aria-pressed="false" title="Afficher / masquer"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="o" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle class="o" cx="12" cy="12" r="3"/><path class="barre" d="M4 4l16 16"/></svg></button></div></div>
    <p class="err" id="lgErr" role="alert"></p>
    <button class="btn" type="submit">Se connecter</button>
  </form>
</div>
<div class="loading" id="loading">Chargement…</div>

<div class="prof-grid" id="app" hidden>
  <nav class="nav" id="nav" aria-label="Menu"></nav>
  <main id="main" style="display:grid;gap:18px;min-width:0;align-content:start"></main>
</div>
<script src="/vendor/xlsx.full.min.js"></script>
<script type="module" src="/js/prof.js"></script>
</body>
</html>
